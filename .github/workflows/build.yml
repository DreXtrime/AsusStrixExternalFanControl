name: Build

on:
  push:
    branches: [main]
    tags:     ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/AsusFanControl.csproj

      - name: Build
        run: dotnet build src/AsusFanControl.csproj --configuration Release --no-restore

      - name: Publish (self-contained single exe)
        run: >
          dotnet publish src/AsusFanControl.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish/

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AsusFanControl
          path: publish/AsusFanControl.exe
          retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/AsusFanControl.csproj
          --configuration Release
          --runtime win-x86
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: publish/AsusFanControl.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
